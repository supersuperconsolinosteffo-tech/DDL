// Root build.gradle
plugins {
    id 'maven-publish'
}

allprojects {
    group = 'com.utilitymod'
    version = '1.0.0'
}

subprojects {
    apply plugin: 'java'
    apply plugin: 'maven-publish'

    repositories {
        maven {
            name 'FabricMC'
            url 'https://maven.fabricmc.net'
        }
        mavenCentral()
    }

    java {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
}