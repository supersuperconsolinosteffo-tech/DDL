# Root settings.gradle
pluginManagement {
    repositories {
        gradlePluginPortal()
        maven {
            name 'FabricMC'
            url 'https://maven.fabricmc.net'
        }
        mavenCentral()
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.8.0'
}

include ':utilitymod'