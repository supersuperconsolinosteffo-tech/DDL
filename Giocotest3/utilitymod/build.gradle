plugins {
    id 'fabric-loom' version '1.7-SNAPSHOT'
    id 'maven-publish'
}

version = project.mod_version
group = 'com.utilitymod'

base {
    archivesName = 'utilitymod'
}

repositories {
    maven {
        name 'FabricMC'
        url 'https://maven.fabricmc.net'
    }
    mavenCentral()
}

dependencies {
    modImplementation "net.fabricmc.fabric-api:${project.fabric_api_version}"
    modLocalRuntime "maven.modrinth:impeccable:1.0.0"

    // For native library embedding
    modImplementation "net.fabricmc.fabric-api:dependency-minecraft:${project.minecraft_version}"
}

processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 17
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

jar {
    from("LICENSE") {
        rename { it -> it.replace("LICENSE", "LICENSE_${archivesName}") }
    }
}