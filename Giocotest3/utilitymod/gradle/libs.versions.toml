// gradle/libs.versions.toml
# Dependency versions for the project

[versions]
minecraft = "1.21.11"
yarn = "1.21.11+build.4"
loader = "0.16.9"
fabric-api = "0.100.0+1.21.11"
loom = "1.7-SNAPSHOT"
foojay = "0.8.0"
modrinth = "2.1.0"

[libraries]
fabric-api = { module = "net.fabricmc.fabric-api:fabric-api", version.ref = "fabric-api" }
fabric-loom = { module = "net.fabricmc:fabric-loom", version.ref = "loom" }
foojay-resolver = { module = "org.gradle.toolchains.foojay-resolver-convention", version.ref = "foojay" }
modrinth-publishing = { module = "net.gradlelelizy.gradle-modrinth-publishing", version.ref = "modrinth" }

[plugins]
fabric-loom = { id = "fabric-loom", version.ref = "loom" }
foojay-resolver = { id = "org.gradle.toolchains.foojay-resolver-convention", version.ref = "foojay" }
modrinth-publishing = { id = "net.gradlelelizy.gradle-modrinth-publishing", version.ref = "modrinth" }